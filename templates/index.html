<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>転生診断 | Umbrella Parade</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <div class="hero">
    <img class="hero-bg" src="{{ url_for('static', filename='bg-characters.png') }}" alt="">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <p class="scroll-hint">▼ scroll</p>
    </div>
  </div>

  <div class="container">
    <div class="intro-text">
      <h2 class="intro-catch">あなたの転生先、教えます。逃げても無駄です。</h2>
      <p>突然ですが、あなたは転生したことがありますか。</p>
      <p>ないですよね。当たり前です。でももし転生するとしたら何になるか、気になりませんか。</p>
      <p>気になりますよね。なりますよね。なってください。</p>
    </div>

    <form action="/result" method="POST">
      <div class="question-block">
        <label class="question-label">生まれた月は？</label>
        <div class="select-wrapper">
          <select name="birth_month" required>
            <option value="" disabled selected>選んでください</option>
            {% for m in range(1, 13) %}
            <option value="{{ m }}">{{ m }}月</option>
            {% endfor %}
          </select>
        </div>
      </div>

      {% for q in questions %}
      <div class="question-block">
        <label class="question-label">Q{{ loop.index }}. {{ q.text }}</label>
        <div class="options">
          {% for opt in q.options %}
          <label class="option-label">
            <input type="radio" name="{{ q.id }}" value="{{ opt.type }}" required>
            <span>{{ opt.label }}</span>
          </label>
          {% endfor %}
        </div>
      </div>
      {% endfor %}

      <button type="submit" class="submit-btn">判定する</button>
    </form>
  </div>

</body>
</html>
